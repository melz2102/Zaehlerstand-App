<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Zähler"/>
<meta name="theme-color" content="#06090f"/>
<title>Zählerstände</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#06090f;color:#e2e8f0;font-family:-apple-system,'Segoe UI',sans-serif;overscroll-behavior:none;min-height:100vh;}
input,select,button{font-family:inherit;}
button{cursor:pointer;}
.tabs::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Storage ──────────────────────────────────────────────────────────
const SKEY = "zaehler_v4";
function loadState(){try{const r=localStorage.getItem(SKEY);return r?JSON.parse(r):null;}catch{return null;}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch{}}

// ── Helpers ──────────────────────────────────────────────────────────
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const fmtD=iso=>new Date(iso).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtN=(n,d=2)=>Number(n).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const today=()=>new Date().toISOString().slice(0,10);

const TEMPLATES=[
  {type:"strom", label:"Strom",      unit:"kWh",icon:"⚡",color:"#f59e0b"},
  {type:"gas",   label:"Gas",         unit:"m³", icon:"🔥",color:"#ef4444"},
  {type:"wasser",label:"Wasser",      unit:"m³", icon:"💧",color:"#3b82f6"},
  {type:"waerme",label:"Wärme",       unit:"MWh",icon:"🌡️",color:"#8b5cf6"},
  {type:"solar", label:"Solar",       unit:"kWh",icon:"☀️",color:"#eab308"},
  {type:"oel",   label:"Öl",          unit:"L",  icon:"🛢️",color:"#78716c"},
  {type:"custom",label:"Eigener Typ", unit:"",   icon:"📟",color:"#6366f1"},
];
const ICONS=["⚡","🔥","💧","🌡️","☀️","🛢️","📟","🏠","🔌","♻️","🌿","❄️"];
const COLORS=["#f59e0b","#ef4444","#3b82f6","#8b5cf6","#eab308","#78716c","#6366f1","#22d3ee","#a3e635","#f472b6","#fb923c","#34d399"];

// ── State ────────────────────────────────────────────────────────────
let state = {
  meters: [
    {id:uid(),name:"Strom Haus",  type:"strom", unit:"kWh",icon:"⚡",color:"#f59e0b"},
    {id:uid(),name:"Gas Heizung", type:"gas",   unit:"m³", icon:"🔥",color:"#ef4444"},
    {id:uid(),name:"Wasser",      type:"wasser",unit:"m³", icon:"💧",color:"#3b82f6"},
  ],
  entries:{},   // {meterId:[{id,value,date,note}]}
  tab:"overview",
  view:"dashboard",
  form:{value:"",date:today(),note:""},
  editId:null,
  modal:null,   // null | "addMeter" | {type:"delMeter"|"delEntry",payload}
  warn:"",
  mForm:{name:"",type:"strom",unit:"kWh",icon:"⚡",color:"#f59e0b"},
};

const saved = loadState();
if(saved && saved.meters?.length){
  state.meters  = saved.meters;
  state.entries = saved.entries||{};
}

function persist(){saveState({meters:state.meters,entries:state.entries});}

// ── DOM helpers ──────────────────────────────────────────────────────
const el=(tag,props={},children=[])=>{
  const e=document.createElement(tag);
  Object.entries(props).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")e.className=v;
    else e.setAttribute(k,v);
  });
  children.forEach(c=>{
    if(c==null||c===false)return;
    if(typeof c==="string"||typeof c==="number")e.appendChild(document.createTextNode(String(c)));
    else if(c instanceof Node)e.appendChild(c);
  });
  return e;
};
const txt=s=>document.createTextNode(String(s??''));

// ── Render ───────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  app.appendChild(buildApp());
}

function setTab(t){state.tab=t;state.view="dashboard";state.warn="";render();}
function setView(v){state.view=v;state.warn="";render();}
function setState(patch){Object.assign(state,patch);render();}

// ── Computations ─────────────────────────────────────────────────────
function getEntries(id){
  return ((state.entries[id]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)));
}
function lastConsumption(ents){
  if(ents.length<2)return null;
  return +(ents[ents.length-1].value - ents[ents.length-2].value).toFixed(3);
}
function yearConsumption(ents){
  const ya=new Date(); ya.setFullYear(ya.getFullYear()-1);
  const ye=ents.filter(e=>new Date(e.date)>=ya);
  return ye.length>=2?+(ye[ye.length-1].value-ye[0].value).toFixed(3):null;
}
function computeForecast(ents){
  const s=[...ents];
  if(s.length<2)return null;
  const now=new Date(),ys=new Date(now.getFullYear(),0,1),ye=new Date(now.getFullYear(),11,31);
  const ty=s.filter(e=>new Date(e.date).getFullYear()===now.getFullYear());
  if(!ty.length)return null;
  const base=s.filter(e=>new Date(e.date)<=ys).pop()||s[0],last=ty[ty.length-1];
  const days=Math.max(1,(new Date(last.date)-new Date(base.date))/86400000);
  const rate=(last.value-base.value)/days;
  return{forecast:+(rate*365).toFixed(2),remaining:+(rate*((ye-new Date(last.date))/86400000)).toFixed(2),rate:+rate.toFixed(4)};
}

// ── Styles ───────────────────────────────────────────────────────────
const S={
  app:{minHeight:"100vh",background:"#06090f",paddingBottom:"80px"},
  hdr:{background:"linear-gradient(160deg,#170d38 0%,#0a1020 60%,#06090f 100%)",borderBottom:"1px solid #131d2e",padding:"16px 14px 0"},
  htit:{fontSize:"18px",fontWeight:"900",letterSpacing:"-0.5px",color:"#f0f6ff",marginBottom:"12px",display:"flex",alignItems:"center",justifyContent:"space-between"},
  tabs:{display:"flex",gap:"1px",overflowX:"auto",paddingBottom:"0",alignItems:"flex-end",scrollbarWidth:"none"},
  tab:(a,c)=>({padding:"8px 12px",borderRadius:"8px 8px 0 0",border:"none",fontSize:"11px",fontWeight:a?"700":"500",whiteSpace:"nowrap",background:a?"#0d1726":"transparent",color:a?c:"#475569",borderBottom:a?`2px solid ${c}`:"2px solid transparent",transition:"all .2s"}),
  body:{padding:"14px 12px",maxWidth:"620px",margin:"0 auto"},
  card:{background:"#0d1726",borderRadius:"14px",padding:"15px 17px",marginBottom:"11px",border:"1px solid #131d2e"},
  g2:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"9px",marginBottom:"11px"},
  stat:c=>({background:"#06090f",borderRadius:"12px",padding:"13px",border:`1px solid ${c}1a`}),
  slbl:{fontSize:"10px",color:"#475569",textTransform:"uppercase",letterSpacing:"1px",marginBottom:"4px"},
  sval:c=>({fontSize:"20px",fontWeight:"900",color:c,lineHeight:"1.1"}),
  sunit:{fontSize:"10px",color:"#475569",marginTop:"3px"},
  sec:{fontSize:"10px",color:"#374151",textTransform:"uppercase",letterSpacing:"1.5px",marginBottom:"10px",fontWeight:"800"},
  inp:{width:"100%",background:"#06090f",border:"1px solid #1e293b",borderRadius:"10px",padding:"12px 13px",color:"#e2e8f0",fontSize:"16px",outline:"none",marginBottom:"9px",display:"block"},
  sel:{width:"100%",background:"#06090f",border:"1px solid #1e293b",borderRadius:"10px",padding:"10px 13px",color:"#e2e8f0",fontSize:"14px",outline:"none",marginBottom:"9px",display:"block"},
  btn:(c,o)=>({padding:"11px 18px",borderRadius:"10px",border:o?`1px solid ${c}`:"none",background:o?"transparent":c,color:o?c:"#fff",fontWeight:"700",fontSize:"13px"}),
  warn:{background:"#7c200011",border:"1px solid #f59e0b55",borderRadius:"8px",padding:"9px 13px",color:"#fbbf24",fontSize:"12px",marginBottom:"9px"},
  nav:{position:"fixed",bottom:"0",left:"0",right:"0",background:"#0d1726",borderTop:"1px solid #131d2e",display:"flex",zIndex:"99"},
  nbtn:a=>({flex:"1",padding:"10px 4px",border:"none",background:a?"#131d2e":"transparent",color:a?"#e2e8f0":"#374151",fontWeight:a?"700":"500",fontSize:"10px",display:"flex",flexDirection:"column",alignItems:"center",gap:"2px"}),
  hrow:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",padding:"11px 0",borderBottom:"1px solid #0d1726"},
  bdg:c=>({background:`${c}18`,color:c,padding:"2px 8px",borderRadius:"20px",fontSize:"11px",fontWeight:"700",display:"inline-block",marginTop:"5px"}),
  empty:{textAlign:"center",padding:"50px 20px",color:"#1e293b"},
  modal:{position:"fixed",inset:"0",background:"rgba(0,0,0,0.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:"200",padding:"16px"},
  mbox:{background:"#0d1726",border:"1px solid #1e293b",borderRadius:"16px",padding:"20px",maxWidth:"360px",width:"100%",maxHeight:"88vh",overflowY:"auto"},
  irow:{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"9px"},
  fab:c=>({position:"fixed",bottom:"82px",right:"16px",width:"52px",height:"52px",borderRadius:"50%",background:c,border:"none",color:"#fff",fontSize:"28px",boxShadow:`0 4px 22px ${c}55`,display:"flex",alignItems:"center",justifyContent:"center",zIndex:"100"}),
};

// ── Main builder ─────────────────────────────────────────────────────
function buildApp(){
  const {tab,view,meters,entries,modal,warn,form,editId,mForm}=state;
  const isOver=tab==="overview", isSett=tab==="settings";
  const meter=meters.find(m=>m.id===tab);
  const mEnts=meter?getEntries(tab):[];
  const lastE=mEnts[mEnts.length-1],prevE=mEnts[mEnts.length-2];
  const lastC=lastE&&prevE?+(lastE.value-prevE.value).toFixed(3):null;
  const yc=meter?yearConsumption(mEnts):null;
  const avgMon=yc!=null?+(yc/12).toFixed(3):null;
  const fc=meter?computeForecast(mEnts):null;

  const wrap=el("div",{style:S.app});

  // ── Modals ──
  if(modal==="addMeter"){
    const overlay=el("div",{style:S.modal,onclick:e=>{if(e.target===overlay){state.modal=null;render();}}});
    const box=el("div",{style:S.mbox});
    box.appendChild(el("div",{style:{fontSize:"15px",fontWeight:"800",marginBottom:"14px",color:"#f0f6ff"}},["Neuen Zähler anlegen"]));

    box.appendChild(el("div",{style:S.slbl},["Typ wählen"]));
    const selTyp=el("select",{style:S.sel,onchange:e=>{
      const t=TEMPLATES.find(x=>x.type===e.target.value)||TEMPLATES[0];
      state.mForm={...state.mForm,type:t.type,unit:t.unit,icon:t.icon,color:t.color};render();
    }});
    TEMPLATES.forEach(t=>{
      const o=el("option",{value:t.type},[`${t.icon} ${t.label}`]);
      if(t.type===mForm.type)o.selected=true;
      selTyp.appendChild(o);
    });
    box.appendChild(selTyp);

    box.appendChild(el("div",{style:S.slbl},["Name des Zählers"]));
    const nameInp=el("input",{style:S.inp,type:"text",placeholder:"z.B. Strom Keller",value:mForm.name,
      oninput:e=>{state.mForm.name=e.target.value;}});
    box.appendChild(nameInp);

    box.appendChild(el("div",{style:S.slbl},["Einheit"]));
    const unitInp=el("input",{style:S.inp,type:"text",placeholder:"kWh, m³, L …",value:mForm.unit,
      oninput:e=>{state.mForm.unit=e.target.value;}});
    box.appendChild(unitInp);

    box.appendChild(el("div",{style:S.slbl},["Symbol"]));
    const iconRow=el("div",{style:S.irow});
    ICONS.forEach(ic=>{
      const b=el("button",{
        style:{padding:"6px 10px",borderRadius:"8px",border:`1px solid ${mForm.icon===ic?mForm.color:"#1e293b"}`,background:mForm.icon===ic?`${mForm.color}22`:"transparent",fontSize:"16px"},
        onclick:()=>{state.mForm.icon=ic;render();}
      },[ic]);
      iconRow.appendChild(b);
    });
    box.appendChild(iconRow);

    box.appendChild(el("div",{style:S.slbl},["Farbe"]));
    const colorRow=el("div",{style:{...S.irow,marginBottom:"14px"}});
    COLORS.forEach(c=>{
      const d=el("div",{
        style:{width:"26px",height:"26px",borderRadius:"50%",background:c,border:mForm.color===c?"3px solid #fff":"2px solid transparent",cursor:"pointer",flexShrink:"0"},
        onclick:()=>{state.mForm.color=c;render();}
      });
      colorRow.appendChild(d);
    });
    box.appendChild(colorRow);

    const btnRow=el("div",{style:{display:"flex",gap:"9px"}});
    btnRow.appendChild(el("button",{style:S.btn("#1e293b"),onclick:()=>{state.modal=null;render();}},["Abbrechen"]));
    const addBtn=el("button",{style:{...S.btn(mForm.color),flex:"1"},onclick:()=>{
      if(!state.mForm.name.trim())return;
      const m={id:uid(),name:state.mForm.name.trim(),type:state.mForm.type,unit:state.mForm.unit,icon:state.mForm.icon,color:state.mForm.color};
      state.meters=[...state.meters,m]; state.modal=null; state.tab=m.id; state.view="dashboard"; persist(); render();
    }},[`${mForm.icon} Zähler anlegen`]);
    btnRow.appendChild(addBtn);
    box.appendChild(btnRow);
    overlay.appendChild(box);
    wrap.appendChild(overlay);
  }

  if(modal?.type==="delMeter"){
    const m=modal.payload;
    const cnt=(entries[m.id]||[]).length;
    const overlay=el("div",{style:S.modal});
    const box=el("div",{style:S.mbox});
    box.appendChild(el("div",{style:{fontWeight:"800",fontSize:"15px",marginBottom:"7px"}},["Zähler löschen?"]));
    box.appendChild(el("div",{style:{color:"#64748b",fontSize:"13px",marginBottom:"6px"}},[`${m.icon} ${m.name}`]));
    box.appendChild(el("div",{style:{color:"#ef4444",fontSize:"12px",marginBottom:"18px"}},[`⚠️ Alle ${cnt} Ablesungen werden unwiderruflich gelöscht.`]));
    const btnRow=el("div",{style:{display:"flex",gap:"9px"}});
    btnRow.appendChild(el("button",{style:{...S.btn("#1e293b"),flex:"1"},onclick:()=>{state.modal=null;render();}},["Abbrechen"]));
    btnRow.appendChild(el("button",{style:{...S.btn("#dc2626"),flex:"1"},onclick:()=>{
      state.meters=state.meters.filter(x=>x.id!==m.id);
      const ne={...state.entries}; delete ne[m.id]; state.entries=ne;
      state.modal=null; state.tab="overview"; persist(); render();
    }},["Löschen"]));
    box.appendChild(btnRow);
    overlay.appendChild(box); wrap.appendChild(overlay);
  }

  if(modal?.type==="delEntry"){
    const e=modal.payload;
    const overlay=el("div",{style:S.modal});
    const box=el("div",{style:S.mbox});
    box.appendChild(el("div",{style:{fontWeight:"800",fontSize:"15px",marginBottom:"7px"}},["Ablesung löschen?"]));
    box.appendChild(el("div",{style:{color:"#64748b",fontSize:"12px",marginBottom:"18px"}},[`${fmtN(e.value)} ${meter?.unit} · ${fmtD(e.date)}`]));
    const btnRow=el("div",{style:{display:"flex",gap:"9px"}});
    btnRow.appendChild(el("button",{style:{...S.btn("#1e293b"),flex:"1"},onclick:()=>{state.modal=null;render();}},["Abbrechen"]));
    btnRow.appendChild(el("button",{style:{...S.btn("#dc2626"),flex:"1"},onclick:()=>{
      state.entries={...state.entries,[tab]:(state.entries[tab]||[]).filter(x=>x.id!==e.id)};
      state.modal=null; persist(); render();
    }},["Löschen"]));
    box.appendChild(btnRow);
    overlay.appendChild(box); wrap.appendChild(overlay);
  }

  // ── Header ──
  const hdr=el("div",{style:S.hdr});
  const htit=el("div",{style:S.htit});
  htit.appendChild(el("span",{},["🏠 Zählerstände"]));
  htit.appendChild(el("button",{style:{background:"none",border:"none",color:"#475569",fontSize:"20px",padding:"2px"},onclick:()=>setTab("settings")},["⚙️"]));
  hdr.appendChild(htit);

  const tabBar=el("div",{style:S.tabs,className:"tabs"});
  const allBtn=el("button",{style:S.tab(isOver,"#22d3ee"),onclick:()=>setTab("overview")},["🏠 Alle"]);
  tabBar.appendChild(allBtn);
  meters.forEach(m=>{
    const name=m.name.length>10?m.name.slice(0,10)+"…":m.name;
    tabBar.appendChild(el("button",{style:S.tab(tab===m.id,m.color),onclick:()=>setTab(m.id)},[`${m.icon} ${name}`]));
  });
  tabBar.appendChild(el("button",{style:{padding:"8px 10px",borderRadius:"8px 8px 0 0",border:"none",fontSize:"18px",background:"transparent",color:"#374151"},
    onclick:()=>{state.mForm={name:"",type:"strom",unit:"kWh",icon:"⚡",color:"#f59e0b"};state.modal="addMeter";render();}},["＋"]));
  hdr.appendChild(tabBar);
  wrap.appendChild(hdr);

  // ── Body ──
  const body=el("div",{style:S.body});

  if(isOver){
    body.appendChild(el("div",{style:{...S.sec,marginTop:"12px"}},["Alle Zähler im Überblick"]));
    if(meters.length===0){
      const emp=el("div",{style:S.empty});
      emp.appendChild(el("div",{style:{fontSize:"44px",marginBottom:"10px"}},["📟"]));
      emp.appendChild(el("div",{style:{fontSize:"14px",fontWeight:"700",color:"#334155"}},["Noch keine Zähler angelegt"]));
      emp.appendChild(el("div",{style:{fontSize:"11px",marginTop:"5px",color:"#334155",marginBottom:"20px"}},["Lege deinen ersten Zähler an"]));
      emp.appendChild(el("button",{style:S.btn("#6366f1"),onclick:()=>{state.mForm={name:"",type:"strom",unit:"kWh",icon:"⚡",color:"#f59e0b"};state.modal="addMeter";render();}},["+ Ersten Zähler anlegen"]));
      body.appendChild(emp);
    }
    meters.forEach(m=>{
      const ents=getEntries(m.id);
      const last2=ents[ents.length-1],p2=ents[ents.length-2];
      const cons=last2&&p2?+(last2.value-p2.value).toFixed(3):null;
      const yc2=yearConsumption(ents);
      const card=el("div",{style:{...S.card,cursor:"pointer",borderLeft:`3px solid ${m.color}`},onclick:()=>setTab(m.id)});
      const top=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between"}});
      const left=el("div",{style:{display:"flex",alignItems:"center",gap:"10px"}});
      left.appendChild(el("div",{style:{width:"36px",height:"36px",borderRadius:"10px",background:`${m.color}22`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"20px"}},[m.icon]));
      const info=el("div");
      info.appendChild(el("div",{style:{fontWeight:"800",fontSize:"13px",color:"#e2e8f0"}},[m.name]));
      info.appendChild(el("div",{style:{fontSize:"10px",color:"#374151"}},[`${m.unit} · ${ents.length} Ablesungen`]));
      left.appendChild(info); top.appendChild(left);
      const right=el("div",{style:{textAlign:"right"}});
      right.appendChild(el("div",{style:{fontSize:"16px",fontWeight:"900",color:m.color}},[last2?fmtN(last2.value):"—"]));
      right.appendChild(el("div",{style:{fontSize:"10px",color:"#374151"}},[last2?fmtD(last2.date):"kein Eintrag"]));
      top.appendChild(right); card.appendChild(top);
      if(cons!==null||yc2!==null){
        const badges=el("div",{style:{display:"flex",gap:"7px",marginTop:"9px",flexWrap:"wrap"}});
        if(cons!==null)badges.appendChild(el("span",{style:S.bdg(m.color)},[`Δ ${fmtN(cons)} ${m.unit}`]));
        if(yc2!==null)badges.appendChild(el("span",{style:{...S.bdg(m.color),background:"transparent",border:`1px solid ${m.color}33`}},[`Jahr ${fmtN(yc2)} ${m.unit}`]));
        card.appendChild(badges);
      }
      body.appendChild(card);
    });
    if(meters.length>0){
      body.appendChild(el("button",{style:{...S.btn("#1e293b"),width:"100%",marginTop:"4px",border:"1px solid #1e293b",fontSize:"13px"},
        onclick:()=>{state.mForm={name:"",type:"strom",unit:"kWh",icon:"⚡",color:"#f59e0b"};state.modal="addMeter";render();}},["+ Weiteren Zähler hinzufügen"]));
    }
  }

  if(isSett){
    const card=el("div",{style:{...S.card,marginTop:"12px"}});
    const ch=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"14px"}});
    ch.appendChild(el("div",{style:S.sec},["Meine Zähler"]));
    ch.appendChild(el("button",{style:{...S.btn("#6366f1"),fontSize:"12px",padding:"7px 14px"},
      onclick:()=>{state.mForm={name:"",type:"strom",unit:"kWh",icon:"⚡",color:"#f59e0b"};state.modal="addMeter";render();}},["+ Hinzufügen"]));
    card.appendChild(ch);
    if(!meters.length)card.appendChild(el("div",{style:{color:"#374151",fontSize:"13px",textAlign:"center",padding:"20px 0"}},["Noch keine Zähler"]));
    meters.forEach(m=>{
      const row=el("div",{style:{display:"flex",alignItems:"center",gap:"12px",padding:"12px 0",borderBottom:"1px solid #0d1726"}});
      row.appendChild(el("div",{style:{width:"38px",height:"38px",borderRadius:"10px",background:`${m.color}22`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"20px",flexShrink:"0"}},[m.icon]));
      const info=el("div",{style:{flex:"1",minWidth:"0"}});
      info.appendChild(el("div",{style:{fontWeight:"700",fontSize:"13px",color:"#e2e8f0"}},[m.name]));
      info.appendChild(el("div",{style:{fontSize:"11px",color:"#374151"}},[`${m.unit} · ${(state.entries[m.id]||[]).length} Ablesungen`]));
      row.appendChild(info);
      row.appendChild(el("button",{style:{...S.btn("#1e293b"),fontSize:"11px",padding:"5px 10px"},onclick:()=>setTab(m.id)},["Öffnen"]));
      row.appendChild(el("button",{style:{background:"none",border:"none",color:"#ef444455",fontSize:"17px",padding:"4px"},onclick:()=>{state.modal={type:"delMeter",payload:m};render();}},["🗑"]));
      card.appendChild(row);
    });
    body.appendChild(card);
    const card2=el("div",{style:S.card});
    card2.appendChild(el("button",{style:{...S.btn("#6366f1"),width:"100%",fontSize:"14px",padding:"13px"},
      onclick:()=>{state.mForm={name:"",type:"strom",unit:"kWh",icon:"⚡",color:"#f59e0b"};state.modal="addMeter";render();}},["+ Neuen Zähler anlegen"]));
    body.appendChild(card2);
  }

  if(!isOver&&!isSett&&meter){
    if(view==="dashboard"){
      // Header row
      const hr=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:"12px",marginBottom:"4px"}});
      const hl=el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}});
      hl.appendChild(el("span",{style:{fontSize:"22px"}},[meter.icon]));
      hl.appendChild(el("span",{style:{fontWeight:"800",fontSize:"15px",color:"#e2e8f0"}},[meter.name]));
      hl.appendChild(el("span",{style:{fontSize:"11px",color:"#374151"}},[meter.unit]));
      hr.appendChild(hl);
      hr.appendChild(el("button",{style:{background:"none",border:"none",color:"#374151",fontSize:"13px",padding:"4px 8px"},
        onclick:()=>{state.modal={type:"delMeter",payload:meter};render();}},["🗑 Löschen"]));
      body.appendChild(hr);

      // Stats grid
      const g=el("div",{style:S.g2});
      const mkStat=(label,val,unit,color)=>{
        const s=el("div",{style:S.stat(color)});
        s.appendChild(el("div",{style:S.slbl},[label]));
        s.appendChild(el("div",{style:S.sval(color)},[val]));
        s.appendChild(el("div",{style:S.sunit},[unit]));
        return s;
      };
      const lastE2=mEnts[mEnts.length-1];
      g.appendChild(mkStat("Letzter Stand", lastE2?fmtN(lastE2.value):"—", `${meter.unit} · ${lastE2?fmtD(lastE2.date):"—"}`, meter.color));
      g.appendChild(mkStat("Letzter Verbrauch", lastC!=null?fmtN(lastC):"—", meter.unit, lastC!=null&&lastC<0?"#ef4444":meter.color));
      g.appendChild(mkStat("Ø pro Monat", avgMon!=null?fmtN(avgMon):"—", `${meter.unit} (letztes Jahr)`, meter.color));
      g.appendChild(mkStat("Jahresverbrauch", yc!=null?fmtN(yc):"—", `${meter.unit} (letzte 365 Tage)`, meter.color));
      body.appendChild(g);

      // Forecast
      if(fc){
        const fc_card=el("div",{style:{...S.card,borderColor:`${meter.color}33`,background:`linear-gradient(135deg,${meter.color}0a 0%,#0d1726 100%)`}});
        fc_card.appendChild(el("div",{style:S.sec},[`📈 Jahresprognose ${new Date().getFullYear()}`]));
        const fcrow=el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}});
        const fcl=el("div");
        fcl.appendChild(el("div",{style:{fontSize:"24px",fontWeight:"900",color:meter.color}},[`${fmtN(fc.forecast)} ${meter.unit}`]));
        fcl.appendChild(el("div",{style:{fontSize:"10px",color:"#475569",marginTop:"3px"}},[`Hochrechnung · ${fmtN(fc.rate,3)} ${meter.unit}/Tag`]));
        const fcr=el("div",{style:{textAlign:"right"}});
        fcr.appendChild(el("div",{style:{fontSize:"11px",color:"#374151"}},["erwartet noch"]));
        fcr.appendChild(el("div",{style:{fontSize:"17px",fontWeight:"800",color:"#64748b"}},[fmtN(fc.remaining)]));
        fcr.appendChild(el("div",{style:{fontSize:"10px",color:"#374151"}},[meter.unit]));
        fcrow.appendChild(fcl); fcrow.appendChild(fcr); fc_card.appendChild(fcrow);
        body.appendChild(fc_card);
      }

      // History mini table (last 5)
      if(mEnts.length>0){
        const tcard=el("div",{style:S.card});
        tcard.appendChild(el("div",{style:S.sec},["Letzte Ablesungen"]));
        const last5=[...mEnts].reverse().slice(0,5);
        last5.forEach((e,i,arr)=>{
          const prev=arr[i+1]||mEnts[mEnts.length-2-i]; // approximate
          const diff=i<arr.length-1?+(e.value-arr[i+1].value).toFixed(3):null;
          const row=el("div",{style:{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:i<last5.length-1?"1px solid #0d1726":"none",alignItems:"center"}});
          const left2=el("div");
          left2.appendChild(el("div",{style:{fontWeight:"700",fontSize:"13px",color:"#e2e8f0"}},[`${fmtN(e.value)} ${meter.unit}`]));
          left2.appendChild(el("div",{style:{fontSize:"11px",color:"#374151"}},[fmtD(e.date)+(e.note?` · ${e.note}`:"")]));
          row.appendChild(left2);
          if(diff!==null){
            row.appendChild(el("span",{style:S.bdg(diff<0?"#ef4444":meter.color)},[`${diff>=0?"+":""}${fmtN(diff)}`]));
          }
          tcard.appendChild(row);
        });
        body.appendChild(tcard);

        const btnRow=el("div",{style:{textAlign:"center",marginTop:"4px"}});
        btnRow.appendChild(el("button",{style:{...S.btn("#0d1726"),fontSize:"11px",padding:"7px 16px",border:"1px solid #1e293b"},
          onclick:()=>exportCSV(mEnts,meter)},["⬇ CSV exportieren"]));
        body.appendChild(btnRow);
      }

      if(mEnts.length===0){
        const emp=el("div",{style:S.empty});
        emp.appendChild(el("div",{style:{fontSize:"44px",marginBottom:"10px"}},[meter.icon]));
        emp.appendChild(el("div",{style:{fontSize:"14px",fontWeight:"700",color:"#1e293b"}},["Noch keine Einträge"]));
        emp.appendChild(el("div",{style:{fontSize:"11px",marginTop:"5px",color:"#1e293b"}},["Tippe auf + um die erste Ablesung zu erfassen"]));
        body.appendChild(emp);
      }
    }

    if(view==="add"){
      const card=el("div",{style:{...S.card,marginTop:"12px"}});
      card.appendChild(el("div",{style:{fontSize:"14px",fontWeight:"800",marginBottom:"14px",color:"#f0f6ff"}},[`${meter.icon} ${meter.name} · ${editId?"Eintrag bearbeiten":"Neue Ablesung"}`]));
      if(warn)card.appendChild(el("div",{style:S.warn},[warn]));

      card.appendChild(el("div",{style:S.slbl},[`Zählerstand (${meter.unit})`]));
      const lastE3=mEnts[mEnts.length-1];
      const valInp=el("input",{style:S.inp,type:"number",step:"0.001",inputmode:"decimal",
        placeholder:`z.B. ${lastE3?lastE3.value+50:"12345.678"}`,value:form.value,
        oninput:e=>{state.form.value=e.target.value;state.warn="";}});
      card.appendChild(valInp);

      card.appendChild(el("div",{style:S.slbl},["Datum"]));
      const dateInp=el("input",{style:S.inp,type:"date",value:form.date,
        onchange:e=>{state.form.date=e.target.value;}});
      card.appendChild(dateInp);

      card.appendChild(el("div",{style:S.slbl},["Notiz (optional)"]));
      const noteInp=el("input",{style:S.inp,type:"text",placeholder:"z.B. nach Heizperiode",value:form.note,
        oninput:e=>{state.form.note=e.target.value;}});
      card.appendChild(noteInp);

      const btnRow=el("div",{style:{display:"flex",gap:"9px",marginTop:"4px"}});
      btnRow.appendChild(el("button",{style:S.btn("#1e293b"),onclick:()=>{state.view="dashboard";state.editId=null;state.warn="";render();}},["Abbrechen"]));
      btnRow.appendChild(el("button",{style:{...S.btn(meter.color),flex:"1"},onclick:()=>{
        state.form.value=valInp.value;
        state.form.date=dateInp.value;
        state.form.note=noteInp.value;
        const val=parseFloat(state.form.value.replace(",","."));
        if(isNaN(val)||!state.form.date){state.warn="Bitte einen gültigen Wert und ein Datum eingeben.";render();return;}
        const lastE4=(state.entries[tab]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
        const le=lastE4[lastE4.length-1];
        if(!state.editId&&le&&val<le.value){state.warn=`⚠️ Wert (${fmtN(val)}) liegt unter letztem Stand (${fmtN(le.value)}). Bitte prüfen.`;render();return;}
        const entry={value:val,date:state.form.date,note:state.form.note,id:state.editId||uid()};
        const prev2=state.entries[tab]||[];
        state.entries={...state.entries,[tab]:state.editId?prev2.map(e=>e.id===state.editId?entry:e):[...prev2,entry]};
        state.form={value:"",date:today(),note:""}; state.editId=null; state.warn=""; state.view="dashboard";
        persist(); render();
      }},[editId?"✏️ Aktualisieren":"✓ Speichern"]));
      card.appendChild(btnRow);
      body.appendChild(card);

      if(lastE3&&!editId){
        const ref=el("div",{style:{...S.card,background:"#06090f"}});
        ref.appendChild(el("div",{style:S.slbl},["Letzter Eintrag zum Vergleich"]));
        ref.appendChild(el("div",{style:{color:meter.color,fontWeight:"800",fontSize:"16px"}},[`${fmtN(lastE3.value)} ${meter.unit}`]));
        ref.appendChild(el("div",{style:{color:"#374151",fontSize:"11px",marginTop:"3px"}},[fmtD(lastE3.date)+(lastE3.note?` · ${lastE3.note}`:"")]));
        body.appendChild(ref);
      }
    }

    if(view==="history"){
      const card=el("div",{style:{...S.card,marginTop:"12px"}});
      const ch2=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"12px"}});
      ch2.appendChild(el("div",{style:S.sec},[`${meter.icon} ${meter.name} · Verlauf`]));
      if(mEnts.length>0)ch2.appendChild(el("button",{style:{...S.btn("#0d1726"),fontSize:"10px",padding:"5px 11px",border:"1px solid #1e293b"},onclick:()=>exportCSV(mEnts,meter)},["⬇ CSV"]));
      card.appendChild(ch2);
      if(!mEnts.length)card.appendChild(el("div",{style:{color:"#1e293b",textAlign:"center",padding:"28px 0",fontSize:"13px"}},["Keine Einträge"]));
      [...mEnts].reverse().forEach((e,i,arr)=>{
        const prev2=arr[i+1];
        const diff=prev2?+(e.value-prev2.value).toFixed(3):null;
        const row=el("div",{style:S.hrow});
        const left2=el("div",{style:{flex:"1"}});
        left2.appendChild(el("div",{style:{fontWeight:"700",color:"#e2e8f0",fontSize:"13px"}},[`${fmtN(e.value)} ${meter.unit}`]));
        left2.appendChild(el("div",{style:{fontSize:"11px",color:"#374151",marginTop:"2px"}},[fmtD(e.date)+(e.note?` · ${e.note}`:"")]));
        if(diff!==null)left2.appendChild(el("span",{style:S.bdg(diff<0?"#ef4444":meter.color)},[`${diff>=0?"+":""}${fmtN(diff)} ${meter.unit}`]));
        row.appendChild(left2);
        const btns=el("div",{style:{display:"flex",gap:"4px",marginLeft:"8px"}});
        btns.appendChild(el("button",{style:{background:"none",border:"none",color:"#3b82f6",fontSize:"15px",padding:"4px"},onclick:()=>{
          state.form={value:String(e.value),date:e.date,note:e.note||""}; state.editId=e.id; state.warn=""; state.view="add"; render();
        }},["✏️"]));
        btns.appendChild(el("button",{style:{background:"none",border:"none",color:"#ef444466",fontSize:"15px",padding:"4px"},onclick:()=>{state.modal={type:"delEntry",payload:e};render();}},["🗑"]));
        row.appendChild(btns);
        card.appendChild(row);
      });
      body.appendChild(card);
    }

    // FAB
    if(view!=="add"){
      wrap.appendChild(el("button",{style:S.fab(meter.color),onclick:()=>{
        state.editId=null; state.form={value:"",date:today(),note:""}; state.warn=""; state.view="add"; render();
      }},["＋"]));
    }
  }

  wrap.appendChild(body);

  // ── Bottom Nav ──
  const nav=el("div",{style:S.nav});
  const mkNavBtn=(label,icon,active,onclick)=>{
    const b=el("button",{style:S.nbtn(active),onclick});
    b.appendChild(el("span",{style:{fontSize:"15px"}},[icon]));
    b.appendChild(el("span",{},[label]));
    return b;
  };
  nav.appendChild(mkNavBtn("Alle","🏠",isOver,()=>setTab("overview")));
  if(!isOver&&!isSett){
    nav.appendChild(mkNavBtn("Übersicht","📊",view==="dashboard",()=>setView("dashboard")));
    nav.appendChild(mkNavBtn("Verlauf","📋",view==="history",()=>setView("history")));
  }
  nav.appendChild(mkNavBtn("Zähler","⚙️",isSett,()=>setTab("settings")));
  wrap.appendChild(nav);

  return wrap;
}

function exportCSV(entries,meter){
  const rows=[["Datum","Zählerstand","Verbrauch","Notiz"]];
  entries.forEach((e,i)=>{const p=entries[i-1];rows.push([fmtD(e.date),e.value,p?(e.value-p.value).toFixed(3):"",e.note||""]);});
  const blob=new Blob(["\uFEFF"+rows.map(r=>r.join(";")).join("\n")],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${meter.name}_Zaehlerstaende.csv`;a.click();
}

render();
</script>
</body>
</html>
