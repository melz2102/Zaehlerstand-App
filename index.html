<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zählerstände</title>
<style>
:root{
  --bg:#f5f6f4; --card:#fff; --txt:#1d2421; --mut:#6b7570; --line:#e1e5e2;
  --acc:#2f6f5e; --acc-t:#fff; --warn:#b45309; --bad:#b42318;
  --c0:#2f6f5e; --c1:#c2701a; --c2:#2c6fb0; --c3:#8a4fa3; --c4:#b23a48; --c5:#5d7a2a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141816;--card:#1e2421;--txt:#e8ece9;--mut:#93a09a;--line:#2f3833;--acc:#5fb59d;--acc-t:#0d1512;--warn:#e0a050;--bad:#f08a80;
  --c0:#5fb59d;--c1:#e0a050;--c2:#6aa8e0;--c3:#c08ad6;--c4:#e8808c;--c5:#9cbf5a;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1}
main{max-width:860px;margin:0 auto;padding:14px 14px 110px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:9px 14px;border-radius:10px}
.btn.pri{background:var(--acc);color:var(--acc-t);border-color:var(--acc);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:16px}
.mc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;color:var(--txt)}
.mc.sel{border-color:var(--col)}
.mc .n{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--col);display:inline-block}
.mc .v{font-size:22px;font-weight:700;margin-top:6px}
.mc .s{color:var(--mut);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.panel h2{font-size:17px;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
tr.row{cursor:pointer}
.tw{overflow-x:auto}
.thumb{width:38px;height:38px;object-fit:cover;border-radius:6px;vertical-align:middle;border:1px solid var(--line)}
.warn{color:var(--warn)}
.mut{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.fab{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:6;border-radius:30px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media(min-width:600px){.modal{align-items:center}.modal .box{border-radius:18px}}
.modal h3{margin:0 0 10px;font-size:18px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;font:inherit;font-size:17px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt)}
.photo{width:100%;max-height:46vh;object-fit:contain;background:#000;border-radius:10px;display:block}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.row2 .btn{flex:1;min-width:110px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;color:var(--txt)}
.chk input{width:20px;height:20px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center;padding:10px}
.lb img{max-width:100%;max-height:100%}
svg text{fill:var(--mut);font-size:11px}
svg text.val{fill:var(--txt);font-weight:600}
.prog{font-size:13px;color:var(--mut);margin-bottom:6px}
@media(max-width:520px){.hm{display:none}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:20px;padding:8px 14px;white-space:nowrap;font-size:15px}
.chip.on{background:var(--acc);color:var(--acc-t);border-color:var(--acc);font-weight:600}
.chip.sm{padding:6px 12px;font-size:14px}
.chips.cats .chip{font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
tr.sum td{font-weight:700;border-top:2px solid var(--line)}
th .mut{font-weight:400;text-transform:none}
details.det{border-top:1px solid var(--line);padding:8px 0}
details.det summary{cursor:pointer;font-weight:600;padding:4px 0}
.mc{cursor:default}
.tools{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>📟 Zählerstände</h1>
  <button class="btn sm" id="btnMeters">Zähler</button>
  <button class="btn sm" id="btnData">Daten</button>
</header>
<main id="main"></main>
<button class="btn pri fab" id="fab">📷 Fotos hinzufügen</button>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="imp" accept="application/json,.json" hidden>
<div id="layer"></div>

<script>
"use strict";
/* ---------- Speicher (IndexedDB, Fallback: Arbeitsspeicher) ---------- */
let db=null; const mem={};
function openDB(){return new Promise(res=>{
  try{const r=indexedDB.open('zaehlerstaende',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>{db=r.result;res(true)};
    r.onerror=()=>res(false);
  }catch(e){res(false)}
});}
function kvGet(k){return new Promise(res=>{
  if(!db)return res(mem[k]);
  const q=db.transaction('kv').objectStore('kv').get(k);
  q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);
});}
function kvSet(k,v){return new Promise(res=>{
  if(!db){mem[k]=v;return res();}
  const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);
  t.oncomplete=()=>res();t.onerror=()=>res();
});}
function kvDel(k){return new Promise(res=>{
  if(!db){delete mem[k];return res();}
  const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);
  t.oncomplete=()=>res();t.onerror=()=>res();
});}

/* ---------- Zustand ---------- */
const COLORS=['var(--c0)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
let meters=[],readings=[],selMeter=null,persistent=true;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const saveMeters=()=>kvSet('meters',meters);
const saveReadings=()=>kvSet('readings',readings);
const photoCache={};
async function getPhoto(id){if(!id)return null;if(photoCache[id])return photoCache[id];const p=await kvGet('p_'+id);if(p)photoCache[id]=p;return p||null;}

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=1)=>n==null||isNaN(n)?'–':Number(n).toLocaleString('de-DE',{maximumFractionDigits:d});
const dayNum=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/86400000;};
const fmtDate=s=>{const [y,m,d]=s.split('-');return `${d}.${m}.${y}`;};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const isoFromMs=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const parseNum=s=>{const v=parseFloat(String(s).trim().replace(/\s/g,'').replace(',','.'));return isNaN(v)?null:v;};
const meterById=id=>meters.find(m=>m.id===id);
const colorOf=m=>COLORS[meters.indexOf(m)%COLORS.length];

function series(meterId){
  const list=readings.filter(r=>r.meterId===meterId).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0));
  return list.map((r,i)=>{
    const p=i>0?list[i-1]:null;
    let diff=null,days=null,neg=false;
    if(p&&!r.reset){diff=r.value-p.value;days=dayNum(r.date)-dayNum(p.date);if(diff<0)neg=true;}
    return {...r,diff,days,neg,perDay:diff!=null&&days>0?diff/days:null};
  });
}

/* ---------- Bildverarbeitung ---------- */
function shrink(file,max=1280,q=.8){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));
    w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Bild nicht lesbar'));};
  img.src=url;
});}

/* ---------- Auswertung ---------- */
const CATS=['Strom','Wärme','Wasser','Gas'];
const catOf=m=>/strom/i.test(m.name)?'Strom':/wärme|waerme/i.test(m.name)?'Wärme':/gas/i.test(m.name)&&!/wasser/i.test(m.name)?'Gas':/wasser/i.test(m.name)?'Wasser':'Sonstige';
const CATICON={Strom:'⚡',Wärme:'🔥',Wasser:'💧',Gas:'🟦',Sonstige:'📟'};
let selYear='alle',selCat=null,selOne=null;
const MONTHN=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const dim=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate();};

/* Verbrauch je Kalendermonat: Differenz zwischen zwei Ablesungen wird gleichmäßig auf die Tage verteilt */
function monthly(meterId){
  const s=series(meterId),out={};
  for(let i=1;i<s.length;i++){
    const r=s[i];if(r.diff==null||r.neg||!(r.days>0))continue;
    const d0=dayNum(s[i-1].date),d1=dayNum(r.date),per=r.diff/r.days;
    for(let d=d0;d<d1;d++){
      const ym=new Date(d*86400000).toISOString().slice(0,7);
      const o=out[ym]||(out[ym]={v:0,days:0});o.v+=per;o.days++;
    }
  }
  return out;
}
function monthList(){
  const set=new Set();
  meters.forEach(m=>Object.keys(monthly(m.id)).forEach(k=>set.add(k)));
  return [...set].sort();
}
function years(){
  const y=new Set();readings.forEach(r=>y.add(r.date.slice(0,4)));return [...y].sort();
}
const shortN=m=>m.name.replace(/\s*\(.*\)/,'').replace(/^(Strom|Wärme|Gas)\s+/,'');
const fmtV=(v,u)=>v==null?'–':fmt(v,Math.abs(v)<10?2:Math.abs(v)<100?1:0);

async function render(){
  const main=$('#main');
  if(!meters.length){main.innerHTML='<div class="empty">Noch keine Zähler angelegt.</div>';return;}
  const ys=years();
  if(selYear!=='alle'&&!ys.includes(selYear))selYear='alle';
  const present=[...new Set(meters.map(catOf))].sort((a,b)=>(CATS.indexOf(a)+9)%9-(CATS.indexOf(b)+9)%9);
  if(!selCat||!present.includes(selCat))selCat=present[0];
  const catMeters=meters.filter(m=>catOf(m)===selCat);
  if(selOne&&!catMeters.some(m=>m.id===selOne))selOne=null;
  const cm=selOne?catMeters.filter(m=>m.id===selOne):catMeters;
  const all=monthList();
  let months=selYear==='alle'?all:Array.from({length:12},(_,i)=>`${selYear}-${String(i+1).padStart(2,'0')}`);
  const mon={};cm.forEach(m=>mon[m.id]=monthly(m.id));
  const inYear=ym=>selYear==='alle'||ym.startsWith(selYear);
  const tot=m=>Object.entries(mon[m.id]).filter(([k])=>inYear(k)).reduce((a,[,o])=>a+o.v,0);
  const cov=m=>Object.entries(mon[m.id]).filter(([k])=>inYear(k)).reduce((a,[,o])=>a+o.days,0);
  let h='';
  if(!persistent)h+='<div class="panel warn">⚠️ Speicher im Browser nicht verfügbar – Daten gehen beim Schließen verloren. Bitte regelmäßig unter „Daten“ sichern.</div>';
  h+='<div class="chips">'+['alle',...ys].map(y=>`<button class="chip ${y===selYear?'on':''}" data-y="${y}">${y==='alle'?'Alle Jahre':y}</button>`).join('')+'</div>';
  h+='<div class="chips cats">'+present.map(c=>`<button class="chip ${c===selCat?'on':''}" data-c="${c}">${CATICON[c]||''} ${c}</button>`).join('')+'</div>';
  if(catMeters.length>1)h+='<div class="chips">'+[`<button class="chip sm ${!selOne?'on':''}" data-m="">Alle ${esc(selCat)}</button>`,...catMeters.map(m=>`<button class="chip sm ${selOne===m.id?'on':''}" data-m="${m.id}" style="${selOne===m.id?'':'border-color:'+colorOf(m)}">${esc(shortN(m))}</button>`)].join('')+'</div>';
  /* Kennzahlen */
  h+='<div class="cards">';
  for(const m of cm){
    const s=series(m.id),last=s[s.length-1],t=tot(m),d=cov(m);
    h+=`<div class="mc" style="--col:${colorOf(m)}"><div class="n"><span class="dot"></span>${esc(m.name)}</div>
      <div class="v">${d?fmtV(t)+' <small>'+esc(m.unit)+'</small>':'–'}</div>
      <div class="s">Verbrauch ${selYear==='alle'?'gesamt':selYear}${d&&d<330&&selYear!=='alle'?' (nur '+d+' Tage erfasst)':''}</div>
      <div class="s">${d?'Ø '+fmtV(t/d*30.4375)+' '+esc(m.unit)+' / Monat':''}</div>
      <div class="s">Stand ${last?fmt(last.value,m.unit==='m³'?3:1)+' '+esc(m.unit)+' · '+fmtDate(last.date):'–'}</div></div>`;
  }
  h+='</div>';
  /* Diagramm */
  if(selCat==='Wasser'){
    for(const m of cm)h+=`<div class="panel"><h2 style="color:${colorOf(m)}">💧 ${esc(m.name)} – pro Monat${selYear==='alle'?'':' '+selYear}</h2>`+stackChart([m],mon,months)+'</div>';
  }else h+=`<div class="panel"><h2>${CATICON[selCat]||''} ${selCat} – Verbrauch pro Monat${selYear==='alle'?'':' '+selYear}</h2>`+stackChart(cm,mon,months)+'</div>';
  /* Monatstabelle */
  h+=`<div class="panel"><h2>Monatsübersicht</h2><div class="tw"><table><thead><tr><th>Monat</th>${cm.map(m=>`<th>${esc(shortN(m))}<br><span class="mut">${esc(m.unit)}</span></th>`).join('')}</tr></thead><tbody>`;
  for(const ym of months){
    const any=cm.some(m=>mon[m.id][ym]);
    const [y,mo]=ym.split('-');
    h+=`<tr class="${any?'':'mut'}"><td>${MONTHN[+mo-1]} ${selYear==='alle'?y:''}</td>`+cm.map(m=>{
      const o=mon[m.id][ym];if(!o)return '<td>–</td>';
      const part=o.days<dim(ym)*0.97;
      return `<td title="${part?'nur '+o.days+' von '+dim(ym)+' Tagen erfasst':''}">${part?'<span class="mut">~</span>':''}${fmtV(o.v)}</td>`;
    }).join('')+'</tr>';
  }
  h+=`<tr class="sum"><td>Summe</td>${cm.map(m=>`<td>${cov(m)?fmtV(tot(m)):'–'}</td>`).join('')}</tr></tbody></table></div>
    <div class="mut" style="font-size:12px;margin-top:8px">Monatswerte werden aus den Ablesungen auf die Tage verteilt (~ = Monat nur teilweise abgedeckt).</div></div>`;
  /* Einzelne Ablesungen */
  h+='<div class="panel"><h2>Ablesungen</h2>';
  for(const m of cm){
    const s=series(m.id).filter(r=>selYear==='alle'||r.date.startsWith(selYear));
    h+=`<details class="det" ${cm.length===1?'open':''}><summary style="color:${colorOf(m)}">${esc(m.name)} <span class="mut">(${s.length})</span></summary>`;
    if(!s.length){h+='<div class="empty">Keine Ablesungen in diesem Zeitraum.</div></details>';continue;}
    h+='<div class="tw"><table><thead><tr><th>Datum</th><th>Stand</th><th>Verbrauch</th><th class="hm">Tage</th><th>Foto</th></tr></thead><tbody>';
    for(const r of s.slice().reverse()){
      h+=`<tr class="row" data-r="${r.id}"><td>${fmtDate(r.date)}${r.reset?' 🔄':''}${/unsicher/i.test(r.note||'')?' <span class="warn" title="'+esc(r.note)+'">❓</span>':''}</td>
        <td>${fmt(r.value,m.unit==='m³'?3:1)}</td>
        <td class="${r.neg?'warn':''}">${r.diff!=null?(r.neg?'⚠ ':'+')+fmt(r.diff,m.unit==='m³'?3:1):'–'}</td>
        <td class="mut hm">${r.days!=null?fmt(r.days,0):'–'}</td>
        <td>${r.photoId?`<img class="thumb" data-p="${r.photoId}" alt="">`:''}</td></tr>`;
    }
    h+='</tbody></table></div></details>';
  }
  h+='<div class="mut" style="font-size:13px;margin-top:8px">Zeile antippen zum Bearbeiten · ❓ = unsicher abgelesen · ⚠ = Stand niedriger als zuvor (Zählerwechsel? Dann beim Eintrag „Zähler getauscht“ ankreuzen).</div></div>';
  main.innerHTML=h;bind();
  document.querySelectorAll('img.thumb').forEach(async im=>{const p=await getPhoto(im.dataset.p);if(p)im.src=p;else im.remove();});
}

function stackChart(cm,mon,months){
  const vals=months.map(ym=>cm.reduce((a,m)=>a+(mon[m.id][ym]?mon[m.id][ym].v:0),0));
  const max=Math.max(...vals,0);
  if(!(max>0))return '<div class="mut" style="margin:6px 0">Noch keine Verbrauchswerte – es werden mindestens zwei Ablesungen benötigt.</div>';
  const n=months.length,W=600,H=230,L=6,R=6,T=22,B=34,bw=(W-L-R)/n;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Verbrauch pro Monat">`;
  months.forEach((ym,i)=>{
    let y=H-B;const x0=L+i*bw+bw*.14,w=bw*.72;
    cm.forEach(m=>{const o=mon[m.id][ym];if(!o)return;const bh=(H-T-B)*o.v/max;y-=bh;
      svg+=`<rect x="${x0}" y="${y}" width="${w}" height="${Math.max(bh,.5)}" fill="${colorOf(m)}" ${o.days<dim(ym)*0.97?'opacity=".55"':''}><title>${esc(m.name)} ${ym}: ${fmtV(o.v)} ${esc(m.unit)}</title></rect>`;});
    const [yy,mm]=ym.split('-');
    if(vals[i]>0)svg+=`<text class="val" x="${x0+w/2}" y="${y-4}" text-anchor="middle">${fmtV(vals[i])}</text>`;
    svg+=`<text x="${x0+w/2}" y="${H-B+14}" text-anchor="middle">${n>14?mm+'/'+yy.slice(2):MONTHN[+mm-1]}</text>`;
  });
  svg+=`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/></svg>`;
  const leg=cm.length>1?'<div class="legend">'+cm.map(m=>`<span><i style="background:${colorOf(m)}"></i>${esc(shortN(m))}</span>`).join('')+'</div>':'';
  return svg+leg+'<div class="mut" style="font-size:12px">Einheit: '+[...new Set(cm.map(m=>m.unit))].join(' / ')+' · blasse Balken = Monat nur teilweise erfasst</div>';
}

function bind(){
  document.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{selYear=b.dataset.y;render();});
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{selCat=b.dataset.c;selOne=null;render();});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{selOne=b.dataset.m||null;render();});
  document.querySelectorAll('tr.row').forEach(tr=>tr.onclick=e=>{
    if(e.target.classList.contains('thumb')){showPhoto(e.target.src);return;}
    editReading(tr.dataset.r);
  });
}
function showPhoto(src){
  if(!src)return;
  const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${src}" alt="">`;
  d.onclick=()=>d.remove();document.body.appendChild(d);
}

/* ---------- Eintrag erfassen / bearbeiten ---------- */
let queue=[],lastMeterUsed=null;
function layer(html){const l=$('#layer');l.innerHTML=`<div class="modal"><div class="box">${html}</div></div>`;return l.firstChild;}
function closeLayer(){$('#layer').innerHTML='';}

$('#fab').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  if(!files.length)return;
  files.sort((a,b)=>a.lastModified-b.lastModified);
  queue=files.map(f=>({file:f,total:files.length}));
  nextInQueue();
};
async function nextInQueue(){
  if(!queue.length){closeLayer();render();return;}
  const item=queue[0];
  let dataUrl=null;
  try{dataUrl=await shrink(item.file);}catch(e){alert('Bild konnte nicht gelesen werden – wird übersprungen.');queue.shift();return nextInQueue();}
  form({photo:dataUrl,date:isoFromMs(item.file.lastModified),progress:`Foto ${item.total-queue.length+1} von ${item.total}`});
}

function form(o){
  const edit=o.edit;
  const opts=meters.map(m=>`<option value="${m.id}" ${m.id===(o.meterId||lastMeterUsed||selMeter)?'selected':''}>${esc(m.name)} (${esc(m.unit)})</option>`).join('');
  layer(`<h3>${edit?'Eintrag bearbeiten':'Zählerstand erfassen'}</h3>
    ${o.progress?`<div class="prog">${o.progress}</div>`:''}
    ${o.photo?`<img class="photo" id="fp" src="${o.photo}" alt="Zählerfoto">`:''}
    <label>Zähler</label><select id="fm">${opts}</select>
    <label>Zählerstand (wie auf dem Foto)</label><input type="text" id="fv" inputmode="decimal" placeholder="z. B. 12345,6" value="${o.value!=null?String(o.value).replace('.',','):''}" autocomplete="off">
    <label>Datum der Ablesung</label><input type="date" id="fd" value="${o.date||today()}">
    <label>Notiz (optional)</label><input type="text" id="fn" value="${esc(o.note||'')}">
    <label class="chk"><input type="checkbox" id="fr" ${o.reset?'checked':''}> Zähler getauscht / neu gestartet (Verbrauch nicht berechnen)</label>
    <div class="row2">
      <button class="btn pri" id="fs">${queue.length>1?'Speichern & weiter':'Speichern'}</button>
      ${edit?'<button class="btn danger" id="fdel">Löschen</button>':(queue.length?'<button class="btn" id="fskip">Überspringen</button>':'')}
      <button class="btn" id="fc">${queue.length||edit?'Abbrechen':'Schließen'}</button>
    </div>`);
  const v=$('#fv');setTimeout(()=>v.focus(),50);
  if(o.photo)$('#fp').onclick=()=>showPhoto(o.photo);
  $('#fc').onclick=()=>{queue=[];closeLayer();render();};
  if($('#fskip'))$('#fskip').onclick=()=>{queue.shift();nextInQueue();};
  if($('#fdel'))$('#fdel').onclick=async()=>{
    if(!confirm('Diesen Eintrag löschen?'))return;
    const r=readings.find(x=>x.id===edit);
    readings=readings.filter(x=>x.id!==edit);
    if(r&&r.photoId){await kvDel('p_'+r.photoId);delete photoCache[r.photoId];}
    await saveReadings();closeLayer();render();
  };
  $('#fs').onclick=async()=>{
    const val=parseNum($('#fv').value);
    if(val==null){alert('Bitte einen Zählerstand eingeben.');return;}
    const rec={meterId:$('#fm').value,date:$('#fd').value||today(),value:val,note:$('#fn').value.trim(),reset:$('#fr').checked};
    lastMeterUsed=rec.meterId;selMeter=rec.meterId;selCat=catOf(meterById(rec.meterId));selOne=null;
    if(edit){
      const r=readings.find(x=>x.id===edit);Object.assign(r,rec);
    }else{
      rec.id=uid();rec.created=Date.now();
      if(o.photo){rec.photoId=uid();await kvSet('p_'+rec.photoId,o.photo);photoCache[rec.photoId]=o.photo;}
      readings.push(rec);
    }
    await saveReadings();
    if(!edit&&queue.length){queue.shift();nextInQueue();}
    else{closeLayer();render();}
  };
}
async function editReading(id){
  const r=readings.find(x=>x.id===id);if(!r)return;
  const p=await getPhoto(r.photoId);
  queue=[];
  form({edit:id,photo:p,meterId:r.meterId,value:r.value,date:r.date,note:r.note,reset:r.reset});
}

/* ---------- Zähler verwalten ---------- */
$('#btnMeters').onclick=meterDialog;
function meterDialog(){
  let h='<h3>Zähler</h3>';
  for(const m of meters){
    h+=`<div class="row2" style="margin-top:8px;align-items:center"><span class="dot" style="--col:${colorOf(m)}"></span>
      <span style="flex:3;min-width:120px">${esc(m.name)} <span class="mut">(${esc(m.unit)})</span></span>
      <button class="btn sm" data-ren="${m.id}" style="flex:0">Ändern</button>
      <button class="btn sm danger" data-del="${m.id}" style="flex:0">✕</button></div>`;
  }
  h+=`<label>Neuer Zähler</label><div class="row2" style="margin-top:0"><input type="text" id="nm" placeholder="Name, z. B. Strom FeWo 1" style="flex:3"><input type="text" id="nu" placeholder="Einheit" value="kWh" style="flex:1;min-width:80px"></div>
  <div class="row2"><button class="btn pri" id="nadd">Zähler hinzufügen</button><button class="btn" id="nclose">Fertig</button></div>`;
  layer(h);
  $('#nclose').onclick=()=>{closeLayer();render();};
  $('#nadd').onclick=async()=>{
    const n=$('#nm').value.trim(),u=$('#nu').value.trim()||'kWh';if(!n)return;
    meters.push({id:uid(),name:n,unit:u});await saveMeters();meterDialog();
  };
  document.querySelectorAll('[data-ren]').forEach(b=>b.onclick=async()=>{
    const m=meterById(b.dataset.ren);
    const n=prompt('Name',m.name);if(n===null)return;
    const u=prompt('Einheit',m.unit);if(u===null)return;
    m.name=n.trim()||m.name;m.unit=u.trim()||m.unit;await saveMeters();meterDialog();
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const m=meterById(b.dataset.del);
    const cnt=readings.filter(r=>r.meterId===m.id).length;
    if(!confirm(`„${m.name}“ löschen${cnt?` inkl. ${cnt} Einträgen und Fotos`:''}?`))return;
    for(const r of readings.filter(r=>r.meterId===m.id)){if(r.photoId)await kvDel('p_'+r.photoId);}
    readings=readings.filter(r=>r.meterId!==m.id);meters=meters.filter(x=>x.id!==m.id);
    await saveMeters();await saveReadings();meterDialog();
  });
}

/* ---------- Daten: Export / Backup ---------- */
$('#btnData').onclick=()=>{
  layer(`<h3>Daten</h3><div class="tools" style="flex-direction:column">
    <button class="btn" id="xcsv">📄 Tabelle als CSV (Excel) exportieren</button>
    <button class="btn" id="xjson">💾 Komplett-Backup inkl. Fotos (JSON)</button>
    <button class="btn" id="ijson">📥 Backup einspielen (ersetzt alles)</button>
    <button class="btn" id="xclose">Schließen</button></div>
    <div class="mut" style="font-size:13px;margin-top:10px">Alle Daten liegen nur in diesem Browser. Ein Backup ab und zu ist sinnvoll.</div>`);
  $('#xclose').onclick=closeLayer;
  $('#xcsv').onclick=exportCSV;
  $('#xjson').onclick=exportJSON;
  $('#ijson').onclick=()=>$('#imp').click();
};
function download(name,text,type){
  const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},2000);
}
function exportCSV(){
  const rows=[['Datum','Zähler','Stand','Einheit','Verbrauch','Tage','Verbrauch pro Tag','Zählerwechsel','Notiz']];
  const n=x=>x==null?'':String(Math.round(x*1000)/1000).replace('.',',');
  for(const m of meters)for(const r of series(m.id))
    rows.push([fmtDate(r.date),m.name,n(r.value),m.unit,n(r.diff),r.days??'',n(r.perDay),r.reset?'ja':'',r.note||'']);
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  download('zaehlerstaende.csv','﻿'+csv,'text/csv;charset=utf-8');
}
async function exportJSON(){
  const photos={};
  for(const r of readings)if(r.photoId){const p=await getPhoto(r.photoId);if(p)photos[r.photoId]=p;}
  download(`zaehlerstaende-backup-${today()}.json`,JSON.stringify({v:1,meters,readings,photos}),'application/json');
}
$('#imp').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.meters)||!Array.isArray(d.readings))throw 0;
    const merge=meters.length&&readings.length&&confirm('OK = zu den vorhandenen Daten HINZUFÜGEN\nAbbrechen = alles durch die Datei ERSETZEN');
    if(merge){
      for(const m of d.meters)if(!meters.some(x=>x.id===m.id))meters.push(m);
      for(const r of d.readings)if(!readings.some(x=>x.id===r.id))readings.push(r);
    }else{
      if(!confirm('Alle aktuellen Daten durch die Datei ersetzen?'))return;
      for(const r of readings)if(r.photoId)await kvDel('p_'+r.photoId);
      meters=d.meters;readings=d.readings;
      for(const k in photoCache)delete photoCache[k];
    }
    for(const id in (d.photos||{}))await kvSet('p_'+id,d.photos[id]);
    await saveMeters();await saveReadings();closeLayer();render();
  }catch(err){alert('Die Datei ist kein gültiges Backup.');}
};

/* ---------- Start ---------- */
(async function init(){
  persistent=await openDB();
  meters=(await kvGet('meters'))||null;
  readings=(await kvGet('readings'))||[];
  if(!meters&&!window.SEED){
    try{
      const r=await fetch('daten.json',{cache:'no-store'});
      if(r.ok){const d=await r.json();
        if(Array.isArray(d.meters)&&Array.isArray(d.readings)){
          meters=d.meters;readings=d.readings;
          for(const id in (d.photos||{}))await kvSet('p_'+id,d.photos[id]);
          await saveMeters();await saveReadings();
        }}
    }catch(e){}
  }
  if(!meters){
    meters=[{id:uid(),name:'Strom',unit:'kWh'},{id:uid(),name:'Gas',unit:'m³'},{id:uid(),name:'Wasser',unit:'m³'}];
    await saveMeters();
  }
  selMeter=meters[0].id;
  render();
})();
</script>
